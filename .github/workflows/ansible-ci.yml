name: Ansible CI Pipeline

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install ansible -y

      - name: Run Syntax Check
        run: ansible-playbook -i inventory/hosts playbooks/site.yml --syntax-check
